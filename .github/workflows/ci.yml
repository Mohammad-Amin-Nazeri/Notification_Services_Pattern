name: CI

on:
  push:
    branches:
      - master
      - 'refactor/**'

  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NotificationServices.slnx

      - name: Build
        run: dotnet build NotificationServices.slnx --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test NotificationServices.slnx --configuration Release --no-build --collect:"XPlat Code