name: CI

on:
  push:
    branches:
      - master
      - 'refactor/**'

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NotificationServices.slnx

      - name: Build
        run: dotnet build NotificationServices.slnx --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test NotificationServices.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Pack package
        run: |
          rm -rf ./artifacts
          dotnet pack src/NotificationServices/NotificationServices.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          packages=(./artifacts/*.nupkg)

          if [ ! -e "${packages[0]}" ]; then
            echo "NuGet package not found"
            exit 1
          fi

          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one NuGet package, found ${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          PACKAGE="${packages[0]}"
          echo "Package found: $PACKAGE"

          required_files=(
            "lib/net10.0/NotificationServices.dll"
            "lib/net10.0/NotificationServices.Email.dll"
            "lib/net10.0/NotificationServices.Email.Abstractions.dll"
            "lib/net10.0/NotificationServices.Sms.dll"
            "lib/net10.0/NotificationServices.Sms.Abstractions.dll"
            "README.md"
            "LICENSE"
          )

          for required_file in "${required_files[@]}"; do
            if ! unzip -l "$PACKAGE" | grep -Fq "$required_file"; then
              echo "Required package file is missing: $required_file"
              exit 1
            fi
          done

          if unzip -l "$PACKAGE" | grep -Eq '(^|/)\.pdb$|(^|/)\.xml$'; then
            echo "Unexpected debug/documentation artifacts detected in package."
            exit 1
          fi

          echo "Unified package contents verified successfully."
