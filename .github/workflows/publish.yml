name: Publish NuGet

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NotificationServices.slnx

      - name: Build
        run: dotnet build NotificationServices.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NotificationServices.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/NotificationServices/NotificationServices.csproj -c Release --no-build --output ./artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/NotificationServices.Kit.2.0.1.nupkg" --source "https://api.nuget.org/v3/index.json"
